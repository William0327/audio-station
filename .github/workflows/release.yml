name: Versioned source release artifacts
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m scripts.package_release
      - uses: actions/upload-artifact@v4
        with:
          name: audio-station-source
          path: release/*
# Maintainers publish these artifacts only after the GPU acceptance checklist.
